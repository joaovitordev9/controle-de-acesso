<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Configurar servidor</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #0f172a 0%, #111f3b 100%);
        color: #e2e8f0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        padding: 32px;
      }
      .card {
        width: 100%;
        max-width: 480px;
        margin: auto;
      }
      .logo {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: #2563eb;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 18px;
      }
      .logo svg { width: 28px; height: 28px; stroke: #fff; }
      h1 { font-size: 22px; margin: 0 0 6px; font-weight: 700; }
      p.sub { margin: 0 0 20px; font-size: 14px; color: #94a3b8; line-height: 1.5; }

      .opcao {
        display: flex; gap: 14px; align-items: flex-start;
        padding: 16px 18px; border: 1.5px solid #334155; border-radius: 12px;
        cursor: pointer; margin-bottom: 12px;
        transition: border-color .15s, background .15s;
        background: rgba(255,255,255,0.02);
      }
      .opcao:hover { border-color: #64748b; }
      .opcao:has(input:checked) { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
      .opcao input { margin-top: 4px; width: 18px; height: 18px; accent-color: #3b82f6; }
      .opcao b { font-size: 15px; }
      .opcao span { display: block; font-size: 13px; color: #94a3b8; margin-top: 3px; line-height: 1.45; }

      .campo-wrap { margin-top: 18px; }
      label.lbl { display: block; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; font-weight: 600; }
      input[type="text"] {
        width: 100%; padding: 13px 14px; border-radius: 10px;
        border: 1.5px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 15px;
        outline: none; transition: border-color .15s;
      }
      input[type="text"]:focus { border-color: #3b82f6; }
      input[type="text"]:disabled { opacity: .35; cursor: not-allowed; }

      .erro { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }
      button {
        margin-top: 10px; width: 100%; padding: 14px; border: none; border-radius: 10px;
        background: #2563eb; color: white; font-size: 15px; font-weight: 600; cursor: pointer;
        transition: background .15s;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>

      <h1>Onde está o servidor?</h1>
      <p class="sub">Escolha uma opção abaixo. Você pode alterar isso depois no menu<br /><b>Arquivo → Configurar servidor</b>.</p>

      <label class="opcao">
        <input type="radio" name="modo" value="servidor" checked />
        <div>
          <b>Este computador é o servidor</b>
          <span>Este PC tem o MySQL e o backend instalados e rodando.</span>
        </div>
      </label>

      <label class="opcao">
        <input type="radio" name="modo" value="cliente" />
        <div>
          <b>Conectar a outro computador</b>
          <span>Este PC só usa o sistema; o servidor está em outra máquina da rede.</span>
        </div>
      </label>

      <div class="campo-wrap">
        <label class="lbl" for="endereco">Endereço do servidor (IP do PC servidor)</label>
        <input type="text" id="endereco" placeholder="Ex.: 192.168.0.10" disabled />
      </div>

      <div class="erro" id="erro"></div>
      <button id="salvar">Salvar e abrir</button>
    </div>

    <script>
      const { ipcRenderer } = require("electron");
      const campo = document.getElementById("endereco");
      const erro = document.getElementById("erro");

      // Pré-preenche se já houver configuração salva.
      ipcRenderer.invoke("ler-servidor").then((url) => {
        if (url && !url.includes("localhost")) {
          document.querySelector('input[value="cliente"]').checked = true;
          campo.disabled = false;
          campo.value = url.replace(/^https?:\/\//, "").replace(/:8485$/, "");
        }
      });

      document.querySelectorAll('input[name="modo"]').forEach((r) =>
        r.addEventListener("change", () => {
          campo.disabled = !document.querySelector('input[value="cliente"]').checked;
          if (!campo.disabled) campo.focus();
        })
      );

      function montarUrl() {
        const modo = document.querySelector('input[name="modo"]:checked').value;
        if (modo === "servidor") return "http://localhost:8485";
        let v = campo.value.trim();
        if (!v) return null;
        v = v.replace(/^https?:\/\//, "").replace(/\/+$/, "");
        if (!/:\d+$/.test(v)) v = v + ":8485";
        return "http://" + v;
      }

      document.getElementById("salvar").addEventListener("click", () => {
        const url = montarUrl();
        if (!url) {
          erro.textContent = "Digite o IP do computador servidor.";
          return;
        }
        ipcRenderer.send("salvar-servidor", url);
      });

      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("salvar").click();
      });
    </script>
  </body>
</html>
